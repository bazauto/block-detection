name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ERC and DRC
    runs-on: ubuntu-latest
    # Same KiCad release the board was designed in. A different release can move
    # the rule set, so bump this deliberately, not as a side effect.
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    env:
      HOME: /tmp/kicad-home
    steps:
      - uses: actions/checkout@v7

      - name: kicad-cli version
        run: kicad-cli version

      # A fresh container has no global symbol/footprint library tables, so every stock
      # library reads as "not in the current configuration" and ERC reports it as a
      # warning. Install KiCad's default tables, as a first run of KiCad would.
      - name: Install default library tables
        run: |
          set -eu
          ls /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/"

      # Every severity: the schematic is clean at warning level too, so keep it that way.
      - name: Electrical rules check
        run: >
          kicad-cli sch erc --exit-code-violations --severity-all
          -o erc.rpt bazauto-block-detection.kicad_sch
          || { cat erc.rpt; exit 1; }

      # Errors only, with the board compared against the schematic. The board carries
      # warning-level parity noise from being generated by script (footprints saved
      # without their library prefix, Datasheet '' vs '~'); a real net or footprint
      # mismatch is an error and fails here.
      - name: Design rules check
        run: >
          kicad-cli pcb drc --exit-code-violations --schematic-parity --severity-error
          -o drc.rpt bazauto-block-detection.kicad_pcb
          || { cat drc.rpt; exit 1; }
